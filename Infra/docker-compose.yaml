services:
  api:
    build:
      context: ..
      dockerfile: Infra/docker/Dockerfile.local
    ports:
      - "8081:8081"
      - "8000:8000"
    volumes:
      - ../Backend/demo:/app
      - ~/.m2:/root/.m2
    networks:
      - my-network

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - 6379:6379
    environment:
      REDIS_PASSWORD: local_redis
      REDIS_DISABLE_COMMANDS: FLUSHDB,FLUSHALL
    volumes:
      - redis_data:/bitnami/redis/data
    networks:
      - my-network
    platform: linux/amd64

  db:
    image: postgres:17.2
    restart: "no"
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: local_db
    networks:
      - my-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.dbA
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - my-network
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - my-network
  
networks:
  my-network:
    driver: bridge

volumes:
  pgdata:
  redis_data:
    driver: local
  
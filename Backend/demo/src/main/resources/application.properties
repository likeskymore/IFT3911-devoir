spring.application.name=ticket-system
springdoc.api-docs.path=/api-docs

server.port=8081

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://db:5432/local_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=local_redis

# JWT
secret.key=random_secret_key_xd

# Devtools
spring.devtools.livereload.enabled=true

# App config
app.base-url=http://localhost:8080
# Add the frontend origin (React/Next dev server) so CORS preflight matches.
app.allowed-origins=http://localhost:3000,http://localhost
app.login-page-url=${app.base-url}/auth/login
app.application-name=ticket-system

# JobRunr
jobrunr.background-job-server.enabled=true
jobrunr.dashboard.enabled=true

# Mail
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=user
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security logs
logging.level.org.springframework.security=DEBUG